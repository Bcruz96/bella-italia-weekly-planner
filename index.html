<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bella Italia Weekly Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="logo">
      <img src="bella-logo.png" alt="Bella Italia Logo">
    </div>

    <div class="brand-text">
      <h1>Bella Italia</h1>
      <p>Weekly Planner</p>
    </div>

    <span class="branch-box">BI Wellington Street</span>
  </div>

  <div class="sync-status">
    <span></span>
    Live sync
  </div>
</header>

  <main class="container">
    <p id="appMessage" class="app-message" role="alert" hidden></p>

    <section class="week-selector">
      <button class="arrow-button" id="previousDay" aria-label="Previous day">‹</button>

      <div class="days" id="daysContainer">
        <!-- Days will be created with JavaScript -->
      </div>

      <button class="arrow-button" id="nextDay" aria-label="Next day">›</button>
    </section>

    <section class="day-context" id="dayCard">
      <div class="day-context-toolbar">
        <div class="week-nav">
          <button type="button" id="previousLabel">← Previous week</button>
          <h2 id="monthTitle">May 2026</h2>
          <button type="button" id="nextLabel">Next week →</button>
        </div>

        <button type="button" id="todayButton" class="today-button">Today</button>
      </div>

      <div class="day-context-body">
        <div class="day-context-date">
          <p id="selectedDayName">MONDAY</p>
          <div class="day-context-date-row">
            <h2 id="selectedDayNumber">11</h2>
            <span id="selectedMonth">May 2026</span>
          </div>
        </div>

        <div class="day-context-progress">
          <div class="progress-labels">
            <h2 id="checklistTitle">Monday Checklist</h2>
            <p id="progressText">0/0 tasks completed</p>
          </div>

          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>

        <button type="button" class="add-task-button" id="openTaskModal">
          + Add task
        </button>
      </div>
    </section>

    <section id="taskGroups">
      <!-- Task groups will appear here -->
    </section>

  </main>

  <div class="modal" id="taskModal">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Add a task</h2>
      <p class="modal-description">Plan something for your selected week.</p>

      <form id="taskForm">
        <label class="field-label" for="taskTitle">Task name</label>
        <input
          type="text"
          id="taskTitle" aria-label="Task name"
          placeholder="Task name"
          required
        />

        <label class="field-label" for="taskDay">Day</label>
        <select id="taskDay" aria-label="Task day" required>
          <option value="">Choose day</option>
          <option value="Monday">Monday</option>
          <option value="Tuesday">Tuesday</option>
          <option value="Wednesday">Wednesday</option>
          <option value="Thursday">Thursday</option>
          <option value="Friday">Friday</option>
          <option value="Saturday">Saturday</option>
          <option value="Sunday">Sunday</option>
        </select>

        <label class="field-label" for="taskCategory">Category</label>
        <select id="taskCategory" aria-label="Task category" required>
          <option value="">Choose category</option>
          <option value="Payroll Checks">Payroll Checks</option>
          <option value="Orders">Orders</option>
          <option value="Cleaning">Cleaning</option>
          <option value="Kitchen">Kitchen</option>
          <option value="Front of House">Front of House</option>
          <option value="Weekly Tasks">Weekly Tasks</option>
        </select>



        <div class="modal-actions">
          <button type="button" id="closeTaskModal">Cancel</button>
          <button type="submit">Save Task</button>
        </div>
      </form>
    </div>
  </div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
